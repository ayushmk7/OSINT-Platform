schema_version: 1
name: adsb_military
source_type: adsb_military
layer_type: aviation
display_name: 'Military Flights ADSB'
enabled: true

layer:
  id: aircraft
  name: Military aircraft
  group: Aviation
  description: ADS-B military contacts (adsb.fi)

display:
  icon: plane
  color: '#ffaa00'
  # Colour by barometric altitude (metres): low = pale, cruise = amber, high = orange-red.
  color_by:
    field: altitude
    stops: [[0, '#ffe08a'], [6000, '#ffaa00'], [12000, '#ff6d00']]
  size: 1.0
  rotate: true
  trail: { enabled: true, max_points: 20 }
  # Contacts not re-reported for 5 minutes have left coverage (or landed).
  ttl: '5m'
  fields:
    - { path: metadata.callsign, label: Callsign }
    - { path: metadata.registration, label: Registration }
    - { path: metadata.type, label: Aircraft type }
    - { path: altitude, label: Altitude, format: number, precision: 0, suffix: ' m' }
    - { path: speed, label: Ground speed, format: number, precision: 0, suffix: ' kt' }
    - { path: timestamp, label: Last seen, format: datetime }

transport:
  type: http_poll
  # api.adsb.lol/v2/mil answers HTTP 200 with an EMPTY `ac` array ("total": 0) — the endpoint
  # is alive but the military feed behind it is not, so the aircraft category never appeared on
  # the globe. opendata.adsb.fi serves the same readsb JSON schema (hex/flight/r/t/lat/lon/
  # alt_baro/gs/track) with ~140 live military contacts, so this is a URL swap only.
  url: 'https://opendata.adsb.fi/api/v2/mil'
  method: GET
  headers:
    Accept: 'application/json'
  timeout: '15s'
  interval: '30s'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '1s'
    max_delay: '10s'

parser:
  format: json
  records_path: 'ac'
  max_records: 5000

entity:
  external_id: 'hex'
  name: 'flight'
  metadata:
    callsign: 'flight'
    registration: 'r'
    type: 't'

observation:
  latitude: 'lat'
  longitude: 'lon'
  altitude: 'alt_baro'
  speed: 'gs'
  heading: 'track'
  # alt_baro is feet (or the string "ground" -> 0); the engine stores metres.
  scale:
    altitude: 0.3048
  # No source timestamp field is mapped: the mapper stamps ingest time and the append
  # dedup/retention keep the track bounded. NEVER map a field to the literal "now".

recording:
  mode: append
