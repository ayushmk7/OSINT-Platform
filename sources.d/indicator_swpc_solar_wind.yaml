# NOAA SWPC real-time solar wind speed (DSCOVR/ACE, latest 1-minute value). Fast wind
# (> 600 km/s) often precedes geomagnetic storms.
# Docs: https://www.swpc.noaa.gov/products/real-time-solar-wind
schema_version: 1
name: indicator_swpc_solar_wind
source_type: noaa_swpc
layer_type: space_weather
display_name: 'NOAA SWPC solar wind'
enabled: true
kind: indicator

layer:
  id: space_weather
  name: Space weather
  group: Space
  description: NOAA Space Weather Prediction Center

display:
  icon: satellite
  color: '#b388ff'

transport:
  type: http_poll
  url: 'https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json'
  method: GET
  headers:
    Accept: 'application/json'
  timeout: '20s'
  interval: '5m'

parser:
  format: json

indicator:
  id: '="solar_wind_speed"'
  label: '="Solar wind speed"'
  value: '=number(proton_speed)'
  unit: 'km/s'
  timestamp: time_tag
  severity: "=value >= 800 ? 'high' : value >= 600 ? 'medium' : 'info'"
