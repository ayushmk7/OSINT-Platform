# UN News — RSS/Atom feed shown in the News/Feed panel (kind: feed, no map markers).
schema_version: 1
name: feed_un_news
source_type: rss
layer_type: feed_un_news
display_name: 'UN News'
enabled: true
kind: feed

layer:
  id: feed_un_news
  name: 'UN News'
  group: News
  description: 'United Nations news'

display:
  icon: news
  color: '#80cbc4'

transport:
  type: http_poll
  url: 'https://news.un.org/feed/subscribe/en/news/all/rss.xml'
  method: GET
  headers:
    Accept: 'application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5'
  timeout: '20s'
  interval: '30m'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '5s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 100

feed:
  id: '=guid ?? link'
  title: title
  url: link
  summary: description
  published: published
  tags: categories
