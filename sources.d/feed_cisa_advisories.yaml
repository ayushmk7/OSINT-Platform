# CISA Advisories — RSS/Atom feed shown in the News/Feed panel (kind: feed, no map markers).
schema_version: 1
name: feed_cisa_advisories
source_type: rss
layer_type: feed_cisa_advisories
display_name: 'CISA Advisories'
enabled: true
kind: feed

layer:
  id: feed_cisa_advisories
  name: 'CISA Advisories'
  group: Cyber
  description: 'CISA cybersecurity & ICS advisories'

display:
  icon: shield
  color: '#4fc3f7'

transport:
  type: http_poll
  url: 'https://www.cisa.gov/cybersecurity-advisories/all.xml'
  method: GET
  headers:
    Accept: 'application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5'
  timeout: '20s'
  interval: '15m'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '5s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 100

feed:
  id: '=guid ?? link'
  title: title
  url: link
  summary: description
  published: published
  tags: categories
  severity: '=contains(lower(title), "critical") ? "high" : contains(title, "ICS") ? "medium" : "low"'
