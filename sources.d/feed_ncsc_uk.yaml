# NCSC UK — RSS/Atom feed shown in the News/Feed panel (kind: feed, no map markers).
schema_version: 1
name: feed_ncsc_uk
source_type: rss
layer_type: feed_ncsc_uk
display_name: 'NCSC UK'
enabled: true
kind: feed

layer:
  id: feed_ncsc_uk
  name: 'NCSC UK'
  group: Cyber
  description: 'UK National Cyber Security Centre news & guidance'

display:
  icon: shield
  color: '#ce93d8'

transport:
  type: http_poll
  url: 'https://www.ncsc.gov.uk/api/1/services/v1/all-rss-feed.xml'
  method: GET
  headers:
    Accept: 'application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5'
  timeout: '20s'
  interval: '1h'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '5s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 100

feed:
  id: '=guid ?? link'
  title: title
  url: link
  summary: description
  published: published
  tags: categories
