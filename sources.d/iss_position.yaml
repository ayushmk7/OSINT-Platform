schema_version: 1
name: iss_position
source_type: iss_position
layer_type: space
display_name: 'ISS Position Tracker'
enabled: true

layer:
  id: satellite
  name: Space stations
  group: Space
  description: ISS live position

display:
  icon: iss
  color: '#00f3ff'
  size: 1.3
  trail: { enabled: true, max_points: 50 }
  # No ttl: the ISS is always somewhere.
  fields:
    - { path: altitude, label: Altitude, format: number, precision: 0, suffix: ' m' }
    - { path: metadata.velocity, label: Velocity, format: number, precision: 0, suffix: ' km/h' }
    - { path: metadata.visibility, label: Visibility }
    - { path: timestamp, label: Sample time, format: datetime }

transport:
  type: http_poll
  url: 'https://api.wheretheiss.at/v1/satellites/25544'
  method: GET
  headers:
    Accept: 'application/json'
  timeout: '10s'
  interval: '30s'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '1s'
    max_delay: '15s'

parser:
  format: json
  max_records: 1

entity:
  external_id: 'id'
  name: 'name'
  metadata:
    visibility: 'visibility'
    velocity: 'velocity'

observation:
  latitude: 'latitude'
  longitude: 'longitude'
  altitude: 'altitude'
  speed: 'velocity'
  heading: '0'
  timestamp: 'timestamp'
  # The feed reports altitude in km; the engine stores metres.
  scale:
    altitude: 1000

# Historical track: the feed carries a real per-sample timestamp, so each distinct
# instant becomes one track point and repeat polls of the same instant are no-ops.
recording:
  mode: append
