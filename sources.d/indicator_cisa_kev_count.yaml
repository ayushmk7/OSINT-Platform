# Size of the CISA Known Exploited Vulnerabilities catalog (one reading per catalog release).
# The newest additions themselves arrive through feed_cisa_kev.yaml.
schema_version: 1
name: indicator_cisa_kev_count
source_type: cisa_kev
layer_type: cyber_indicators
display_name: 'CISA KEV catalog size'
enabled: true
kind: indicator

layer:
  id: cyber_indicators
  name: Cyber
  group: Cyber
  description: Vulnerability catalog metrics

display:
  icon: bug
  color: '#ff5c7a'

transport:
  type: http_poll
  url: 'https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json'
  method: GET
  headers:
    Accept: 'application/json'
  timeout: '30s'
  interval: '1h'

# No records_path: the top-level catalog object is the single record.
parser:
  format: json

indicator:
  id: '="kev_count"'
  label: '="CISA KEV entries"'
  value: '=number(count)'
  unit: 'CVEs'
  timestamp: dateReleased
