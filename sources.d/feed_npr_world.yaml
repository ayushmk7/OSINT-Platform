# NPR World — RSS/Atom feed shown in the News/Feed panel (kind: feed, no map markers).
schema_version: 1
name: feed_npr_world
source_type: rss
layer_type: feed_npr_world
display_name: 'NPR World'
enabled: true
kind: feed

layer:
  id: feed_npr_world
  name: 'NPR World'
  group: News
  description: 'NPR world news'

display:
  icon: news
  color: '#9fa8da'

transport:
  type: http_poll
  url: 'https://feeds.npr.org/1004/rss.xml'
  method: GET
  headers:
    Accept: 'application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5'
  timeout: '20s'
  interval: '15m'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '5s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 100

feed:
  id: '=guid ?? link'
  title: title
  url: link
  summary: description
  published: published
  tags: categories
