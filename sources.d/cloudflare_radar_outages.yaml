# Internet outages verified by Cloudflare Radar over the past 7 days (government-directed
# shutdowns, power outages, cable cuts, ...). Source: Cloudflare Radar API
# `GET /radar/annotations/outages` (https://developers.cloudflare.com/api/resources/radar/).
# Needs a Cloudflare API token with the "Radar: Read" permission in CLOUDFLARE_API_TOKEN.
# Outages are reported per country (or per ASN); each is drawn at the country's Wikidata
# centroid from lookups/s3_country_centroids.csv.
schema_version: 1
name: cloudflare_radar_outages
source_type: cloudflare_radar
layer_type: internet_outages
display_name: 'Internet outages (Cloudflare Radar)'
enabled: true

lookups:
  countries: lookups/s3_country_centroids.csv

layer:
  id: internet_outages
  name: Internet outages
  group: Cyber
  description: Cloudflare Radar verified outages, last 7 days, coloured by cause

display:
  icon: alert
  color: '#ff9100'
  color_by:
    field: metadata.cause
    map:
      GOVERNMENT_DIRECTED: '#ff1744'
      POWER_OUTAGE: '#ffea00'
      CABLE_CUT: '#00e5ff'
      WEATHER: '#448aff'
      MILITARY_ACTION: '#d50000'
      TECHNICAL_PROBLEM: '#ff9100'
    default: '#bdbdbd'
  size: 1.2
  ttl: '7d'
  fields:
    - { path: metadata.cause, label: Cause }
    - { path: metadata.outage_type, label: Scope }
    - { path: metadata.description, label: Description }
    - { path: metadata.start, label: Started, format: datetime }
    - { path: metadata.end, label: Ended, format: datetime }
    - { path: metadata.asns, label: ASNs }
    - { path: metadata.link, label: Details, format: link }

transport:
  type: http_poll
  url: 'https://api.cloudflare.com/client/v4/radar/annotations/outages?dateRange=7d&limit=200&format=json'
  method: GET
  auth: { type: bearer, token: '${CLOUDFLARE_API_TOKEN}' }
  headers:
    Accept: 'application/json'
  timeout: '30s'
  interval: '15m'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '5s'
    max_delay: '60s'

parser:
  format: json
  records_path: 'result.annotations'
  max_records: 500

entity:
  external_id: 'id'
  name: "=concat(coalesce(locationsDetails[0].name, locations[0], 'Outage'), ' - ', coalesce(outage.outageCause, 'outage'))"
  metadata:
    cause: 'outage.outageCause'
    outage_type: 'outage.outageType'
    description: 'description'
    start: 'startDate'
    end: 'endDate'
    country: 'locations[0]'
    asns: 'asns'
    link: 'linkedUrl'

observation:
  latitude: "=number(lookup('countries', coalesce(locations[0], asnsDetails[0].location.code)).lat)"
  longitude: "=number(lookup('countries', coalesce(locations[0], asnsDetails[0].location.code)).lon)"
  timestamp: 'startDate'

recording:
  mode: upsert
