# The Hacker News — RSS/Atom feed shown in the News/Feed panel (kind: feed, no map markers).
schema_version: 1
name: feed_thehackernews
source_type: rss
layer_type: feed_thehackernews
display_name: 'The Hacker News'
enabled: true
kind: feed

layer:
  id: feed_thehackernews
  name: 'The Hacker News'
  group: Cyber
  description: 'Cybersecurity news'

display:
  icon: bug
  color: '#ff8a65'

transport:
  type: http_poll
  url: 'https://feeds.feedburner.com/TheHackersNews'
  method: GET
  headers:
    Accept: 'application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5'
  timeout: '20s'
  interval: '15m'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '5s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 100

feed:
  id: '=guid ?? link'
  title: title
  url: link
  summary: description
  published: published
  tags: categories
  severity: '=contains(lower(title), "zero-day") || contains(lower(title), "actively exploited") ? "high" : contains(lower(title), "ransomware") ? "medium" : "info"'
