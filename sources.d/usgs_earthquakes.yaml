schema_version: 1
name: usgs_earthquakes
source_type: usgs_earthquakes
layer_type: earthquakes
display_name: 'USGS Earthquakes'
enabled: true

layer:
  id: geological
  name: Earthquakes
  group: Hazards
  description: USGS, past hour

display:
  icon: quake
  color: '#ff0055'
  color_by:
    field: metadata.magnitude
    stops: [[0, '#ffd166'], [3, '#ff9e00'], [5, '#ff3b3b'], [7, '#ff0055']]
  size: 1.0
  # Quakes older than a day drop off the globe.
  ttl: '24h'
  fields:
    - { path: metadata.magnitude, label: Magnitude, format: number, precision: 1 }
    - { path: metadata.depth, label: Depth, format: number, precision: 1, suffix: ' km' }
    - { path: timestamp, label: Origin time, format: datetime }

transport:
  type: http_poll
  url: 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson'
  method: GET
  headers:
    Accept: 'application/json'
  timeout: '10s'
  interval: '60s'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '1s'
    max_delay: '15s'

parser:
  format: geojson
  records_path: 'features'
  max_records: 1000

entity:
  external_id: 'id'
  name: 'properties.place'
  metadata:
    magnitude: 'properties.mag'
    depth: 'geometry.coordinates[2]'

observation:
  latitude: 'geometry.coordinates[1]'
  longitude: 'geometry.coordinates[0]'
  altitude: 'geometry.coordinates[2]'
  speed: '0'
  heading: '0'
  timestamp: 'properties.time'
  # USGS depth is km, positive-down; the engine stores altitude in metres, so a quake 10 km
  # deep is stored at -10000 m. `metadata.depth` keeps the raw km value for display.
  scale:
    altitude: -1000

# Current-state feed: one observation row per quake, refreshed in place.
recording:
  mode: upsert
