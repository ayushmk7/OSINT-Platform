# Schneier on Security — RSS/Atom feed shown in the News/Feed panel (kind: feed, no map markers).
schema_version: 1
name: feed_schneier
source_type: rss
layer_type: feed_schneier
display_name: 'Schneier on Security'
enabled: true
kind: feed

layer:
  id: feed_schneier
  name: 'Schneier on Security'
  group: Cyber
  description: "Bruce Schneier's blog"

display:
  icon: news
  color: '#b39ddb'

transport:
  type: http_poll
  url: 'https://www.schneier.com/feed/atom/'
  method: GET
  headers:
    Accept: 'application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.5'
  timeout: '20s'
  interval: '30m'
  retry:
    max_attempts: 2
    backoff: exponential
    initial_delay: '5s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 100

feed:
  id: '=guid ?? link'
  title: title
  url: link
  summary: description
  published: published
  tags: categories
