schema_version: 1
name: ptwc_tsunami_bulletins
source_type: noaa_tsunami
layer_type: tsunami_bulletins
display_name: 'PTWC Tsunami Bulletins'
enabled: true

layer:
  id: tsunami_bulletins
  name: Tsunami bulletins
  group: Hazards
  description: NOAA tsunami warning centers, latest bulletin per center

display:
  icon: tsunami
  color: '#00b4d8'
  size: 1.3
  ttl: '7d'
  fields:
    - { path: metadata.center, label: Issued by }
    - { path: timestamp, label: Issued, format: datetime }
    - { path: metadata.url, label: Bulletin, format: link }

transport:
  type: http_poll
  # Atom feed from https://www.tsunami.gov/ (Pacific Tsunami Warning Center, Honolulu)
  url: 'https://www.tsunami.gov/events/xml/PHEBAtom.xml'
  timeout: '20s'
  interval: '5m'
  retry:
    max_attempts: 3
    backoff: exponential
    initial_delay: '2s'
    max_delay: '30s'

parser:
  format: rss
  max_records: 50

entity:
  external_id: 'guid'
  name: '=trim(title)'
  metadata:
    center: "='Pacific Tsunami Warning Center, Honolulu'"
    url: 'link'

observation:
  latitude: 'lat'
  longitude: 'lon'
  timestamp: 'published'
  optional: true

recording:
  mode: upsert
